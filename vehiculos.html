<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>OptiLogistics | Registro de Vehículos</title><link rel="stylesheet" href="styles.css" /></head>
  <body>
    <header class="topbar"><div class="profile">🧑‍✈️ <span>Conductor</span></div><div class="status">Estado: <span class="dot online"></span></div><div class="actions">🔔 ❔</div></header>
    <nav class="main-nav"><a href="index.html">Inicio</a><a href="dashboard.html">Dashboard</a><a href="usuario.html">Usuario</a><a href="vehiculos.html" class="active">Vehículos</a><a href="novedades.html">Novedades</a><a href="turnos.html">Turnos</a><a href="gps.html">GPS</a></nav>

    <main class="container">
      <section class="logo-card"><h1>Opti<span>Logistics</span></h1></section>
      <section class="card">
        <h2>Registro de Vehículos</h2>
        <form class="form-grid two-cols">
          <label>Placa<input value="ABC123" /></label>
          <label>Tipo<input value="Camión" /></label>
          <label>Marca<input value="Hino" /></label>
          <label>Modelo<input value="2023" /></label>
          <label>Capacidad (kg)<input value="12000" /></label>
          <label>Estado<input value="Activo" /></label>
        </form>
      </section>
      <section class="card"><h3>Archivos del vehículo</h3><div class="icon-grid three"><article>📷<p>SOAT</p></article><article>📷<p>Tecnomecánica</p></article><article>📷<p>Tarjeta Propiedad</p></article></div></section>
      <section class="action-buttons"><button>Guardar</button><button>Buscar Reporte</button><button>Subir Archivos</button></section>
    </main>
  </body>
</html>
